'kpi.otY':'加班 · 离职率','kpi.otN':'不加班 · 离职率','kpi.cnt':function(l,n){return l+' / '+n+' 人';},
'qs.aria':'对比问题','qs.lab':'对比：',

'b.group':function(g){return g+' 组';},'b.dept':'部门','b.all':'全部','b.allbut':function(d){return '除'+d+'外';},
'b.ot':'加班','b.any':'不限','b.wlb':'WLB 代码',
'b.aDept':function(g){return g+' 组部门';},'b.aOt':function(g){return g+' 组是否加班';},
'b.aWlb':function(g){return g+' 组 WLB 代码';},'b.aCk':function(g,w){return g+' 组 WLB 代码 '+w;},
'desc.all':'全部部门','desc.except':function(d){return '除'+d+'外';},
'desc.ot':function(o){return '加班：'+o;},'desc.wlb':function(w){return 'WLB 代码 '+(w.length?w.join('、'):'无');},

'int.title':'各组离职率及 Wilson 95% 区间',

'r.diff':function(d,a,b){return 'A − B = '+d+' 个百分点（'+a+' vs '+b+'）';},

'cap.wlb':'WLB 代码方向未确认。',

'th.dept':'部门','th.ot':'加班','th.wlb':'WLB 代码','th.left':'离职','th.rate':'离职率','th.in':'所属组',
'dep.h':'各部门离职率','dep.title':'各部门离职率及 Wilson 95% 区间',

'dep.desc':function(items){return items.map(function(x){return x[0]+' '+x[1]+'，区间 '+x[2]+' 到 '+x[3]+'，'+x[5]+' 人中 '+x[4]+' 人离职';}).join('；')+'。';},
'dt.sum':'部门数据表','dt.cap':'各部门离职率及 Wilson 95% 区间',
'dept.Finance':'财务','dept.HR':'人力资源','dept.Marketing':'市场营销','dept.Sales':'销售'
}};
function T(k){var v=I18N[lang][k];if(v==null)v=I18N.en[k];if(v==null)return k;if(typeof v==='function')return v.apply(null,Array.prototype.slice.call(arguments,1));return v;}
function applyStatic(){
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  document.title=T('meta.title');
  var md=document.querySelector('meta[name="description"]');if(md)md.setAttribute('content',T('meta.desc'));
  each('[data-i18n]',function(el){el.textContent=T(el.getAttribute('data-i18n'));});
  each('[data-i18n-attr]',function(el){el.getAttribute('data-i18n-attr').split(';').forEach(function(p){var kv=p.split(':');el.setAttribute(kv[0],T(kv[1]));});});
  each('[data-lang]',function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===lang?'true':'false');});
  $('at-h1').textContent=T('h1',n0(sumN));
}
/* department names and Yes/No are data values; translate only for display */
function dn(d){return I18N[lang]['dept.'+d]||d;}
function ot(o){return T('ot.'+o);}

/* ---------- selection model ---------- */
function makeSel(dept,o,wlb){return {dept:dept,ot:o,wlb:wlb.slice()};}
function match(sel,g){return (sel.dept==='all'||(sel.dept.charAt(0)==='!'?g.department!==sel.dept.slice(1):g.department===sel.dept))&&(sel.ot==='any'||g.overtime===sel.ot)&&sel.wlb.indexOf(g.work_life_balance)>=0;}
function agg(sel){var cells=G.filter(function(g){return match(sel,g);});return {cells:cells,n:cells.reduce(function(a,g){return a+g.n;},0),left:cells.reduce(function(a,g){return a+g.left;},0)};}
function describe(sel){
  var parts=[];
  if(sel.dept==='all')parts.push(T('desc.all'));else if(sel.dept.charAt(0)==='!')parts.push(T('desc.except',dn(sel.dept.slice(1))));else parts.push(dn(sel.dept));
  if(sel.ot!=='any')parts.push(T('desc.ot',ot(sel.ot)));
  var w=sel.wlb.slice().sort();if(w.length<4)parts.push(T('desc.wlb',w));
  return parts.join(' · ');
}
var ALL=[1,2,3,4];
var QS=[
  {id:'ot',A:makeSel('all','Yes',ALL),B:makeSel('all','No',ALL)},
  {id:'w14',A:makeSel('all','any',[1]),B:makeSel('all','any',[4])},
  {id:'it',A:makeSel('IT','any',ALL),B:makeSel('!IT','any',ALL)},
  {id:'fin',A:makeSel('Finance','Yes',ALL),B:makeSel('Finance','No',ALL)}
];
var state={q:'ot',A:null,B:null};
var COL={A:'#2563EB',B:'#D97706'};

function renderKpis(){
  var host=$('at-kpis');clear(host);
  var y=agg(QS[0].A),n=agg(QS[0].B);
  function card(l,v,sub){var d=h('div',{class:'kpi'},host);h('div',{class:'l'},d,l);h('div',{class:'v'},d,v);h('div',{class:'s'},d,sub);}
  card(T('kpi.n'),n0(sumN),T('kpi.n.s'));
  card(T('kpi.left'),n0(sumL),T('kpi.left.s',pct(sumL/sumN)));
  card(T('kpi.otY'),pct(y.left/y.n),T('kpi.cnt',n0(y.left),n0(y.n)));
  card(T('kpi.otN'),pct(n.left/n.n),T('kpi.cnt',n0(n.left),n0(n.n)));
}

/* question bar */
function buildQs(){
  var host=$('at-qs');clear(host);h('span',null,host,T('qs.lab'));
  QS.map(function(q){return q.id;}).concat(['custom']).forEach(function(id){
    var b=h('button',{type:'button',class:'qb','data-q':id,'aria-pressed':String(state.q===id)},host,T('q.'+id));
    b.addEventListener('click',function(){if(id==='custom'){state.q='custom';render();}else applyQ(id);});
  });
}

/* custom builder (rebuilt on language change, then refilled from state) */
var builder={};
function buildBuilder(){
  ['A','B'].forEach(function(gk){
    var box=$('at-side-'+gk);clear(box);h('b',null,box,T('b.group',gk));
    var l1=h('label',null,box,T('b.dept'));var ds=h('select',{'aria-label':T('b.aDept',gk)},l1);
    h('option',{value:'all'},ds,T('b.all'));DEPTS.forEach(function(d){h('option',{value:d},ds,dn(d));});DEPTS.forEach(function(d){h('option',{value:'!'+d},ds,T('b.allbut',dn(d)));});
    var l2=h('label',null,box,T('b.ot'));var os=h('select',{'aria-label':T('b.aOt',gk)},l2);
    [['any',T('b.any')],['Yes',T('ot.YesT')],['No',T('ot.NoT')]].forEach(function(o){h('option',{value:o[0]},os,o[1]);});
    var grp=h('span',{role:'group','aria-label':T('b.aWlb',gk)},box);grp.appendChild(document.createTextNode(T('b.wlb')+' '));
    var cks=ALL.map(function(w){var l=h('label',{class:'ck'},grp);var c=h('input',{type:'checkbox',value:String(w),'aria-label':T('b.aCk',gk,w)},l);l.appendChild(document.createTextNode(String(w)+' '));return c;});
    builder[gk]={ds:ds,os:os,cks:cks};
    function onChange(){state.q='custom';state[gk]=readSide(gk);render();}
    ds.addEventListener('change',onChange);os.addEventListener('change',onChange);cks.forEach(function(c){c.addEventListener('change',onChange);});
    if(state[gk])writeSide(gk,state[gk]);
  });
}
function readSide(gk){var b=builder[gk];return makeSel(b.ds.value,b.os.value,b.cks.filter(function(c){return c.checked;}).map(function(c){return +c.value;}));}
function writeSide(gk,sel){var b=builder[gk];if(!b)return;b.ds.value=sel.dept;b.os.value=sel.ot;b.cks.forEach(function(c){c.checked=sel.wlb.indexOf(+c.value)>=0;});}
function applyQ(id){var q=QS.filter(function(x){return x.id===id;})[0];state.q=id;state.A=makeSel(q.A.dept,q.A.ot,q.A.wlb);state.B=makeSel(q.B.dept,q.B.ot,q.B.wlb);writeSide('A',state.A);writeSide('B',state.B);render();}

/* donut: left share of the group's own total */
function donut(fig,gk,a,sel){
  clear(fig);h('div',{class:'g'},fig,T('b.group',gk));
  var S=120,r=53,sw=14,C=2*Math.PI*r;
  var svg=s('svg',{width:S,height:S,viewBox:'0 0 '+S+' '+S,role:'img'},fig);
  var p=a.n?a.left/a.n:0;
  s('title',null,svg,a.n?T('dn.desc',gk,describe(sel),pct(p),n0(a.left),n0(a.n)):T('int.none'));
  s('circle',{cx:S/2,cy:S/2,r:r,fill:'none',stroke:'#E6EAF0','stroke-width':sw},svg);
  if(a.n&&a.left)s('circle',{cx:S/2,cy:S/2,r:r,fill:'none',stroke:COL[gk],'stroke-width':sw,'stroke-dasharray':(p*C)+' '+C,transform:'rotate(-90 '+S/2+' '+S/2+')'},svg);
  s('text',{x:S/2,y:S/2+3,'text-anchor':'middle','font-size':22,'font-weight':600,fill:'#1F2933'},svg,a.n?pct(p):'—');
  s('text',{x:S/2,y:S/2+22,'text-anchor':'middle','font-size':12,fill:'#5B6B7B'},svg,n0(a.left)+'/'+n0(a.n));
  h('div',{class:'d'},fig,describe(sel));
}

/* comparison bars on one shared axis */
var svgI=$('at-int');
function drawCompare(a,b,ciA,ciB){
  var W=Math.max(240,$('at-int-host').clientWidth),narrow=W<380;
  var m={l:22,r:narrow?70:84,t:22,b:30},rowH=40,H=m.t+rowH*2+m.b;
  svgI.setAttribute('viewBox','0 0 '+W+' '+H);svgI.setAttribute('width',W);svgI.setAttribute('height',H);keepClear(svgI);
  var ov=sumL/sumN;
  var top=axisTop([ciA[1],ciB[1],a.n?a.left/a.n:NaN,b.n?b.left/b.n:NaN,ov]),stp=tickStep(top);
  var x=function(v){return m.l+v/top*(W-m.l-m.r);};
  for(var t=0;t<=top+1e-9;t+=stp){var tt=Math.round(t*100)/100;s('line',{x1:x(tt),x2:x(tt),y1:m.t-4,y2:H-m.b,stroke:'#EEF1F4'},svgI);s('text',{x:x(tt),y:H-m.b+16,'text-anchor':'middle','font-size':12,fill:'#5B6B7B'},svgI,Math.round(tt*100)+'%');}
  [['A',a,ciA],['B',b,ciB]].forEach(function(r,i){
    var cy=m.t+rowH*i+rowH/2,c=COL[r[0]];
    s('text',{x:m.l-8,y:cy+5,'text-anchor':'end','font-size':14,'font-weight':600,fill:c},svgI,r[0]);
    if(!r[1].n){s('text',{x:m.l+4,y:cy+5,'font-size':12,fill:'#5B6B7B'},svgI,T('int.none'));return;}
    var p=r[1].left/r[1].n;
    s('rect',{x:x(0),y:cy-10,width:Math.max(1,x(p)-x(0)),height:20,rx:2,fill:c,'fill-opacity':.85},svgI);
    s('line',{x1:x(r[2][0]),x2:x(r[2][1]),y1:cy,y2:cy,stroke:'#1F2933','stroke-width':1.5},svgI);
    [r[2][0],r[2][1]].forEach(function(v){s('line',{x1:x(v),x2:x(v),y1:cy-5,y2:cy+5,stroke:'#1F2933','stroke-width':1.5},svgI);});
    s('text',{x:Math.max(x(p),x(r[2][1]))+6,y:cy+5,'font-size':13,'font-weight':600,fill:'#1F2933'},svgI,pct(p));
  });
  s('line',{x1:x(ov),x2:x(ov),y1:m.t-6,y2:H-m.b,stroke:'#5B6B7B','stroke-dasharray':'4 3'},svgI);
  s('text',{x:x(ov),y:m.t-9,'text-anchor':'middle','font-size':12,fill:'#5B6B7B'},svgI,T('overall',pct(ov)));
}

/* ---------- main render ---------- */
function render(){
  each('.qb',function(b){b.setAttribute('aria-pressed',b.getAttribute('data-q')===state.q?'true':'false');});
  $('at-builder').hidden=state.q!=='custom';
  $('at-q-title').textContent=T('q.'+state.q);
  var a=agg(state.A),b=agg(state.B),ciA=wilson(a.left,a.n),ciB=wilson(b.left,b.n);
  donut($('at-A-dn'),'A',a,state.A);donut($('at-B-dn'),'B',b,state.B);
  drawCompare(a,b,ciA,ciB);
  var rd=$('at-read');clear(rd);
  var shared=a.cells.filter(function(c){return b.cells.indexOf(c)>=0;});
  if(shared.length)h('p',{class:'warn'},rd,T('r.shared',shared.length,n0(shared.reduce(function(t,c){return t+c.n;},0))));
  if(a.n&&b.n){
    var pa=a.left/a.n,pb=b.left/b.n,diff=(pa-pb)*100;
    h('p',{class:'read'},rd,T('r.diff',(diff>0?'+':diff<0?'−':'±')+Math.abs(diff).toFixed(1),pct(pa),pct(pb)));
    $('at-int-desc').textContent=T('r.desc',T('ci.desc','A',pct(pa),pct(ciA[0]),pct(ciA[1]),a.n),T('ci.desc','B',pct(pb),pct(ciB[0]),pct(ciB[1]),b.n),pct(sumL/sumN));
  }else{h('p',{class:'read'},rd,T('r.empty'));$('at-int-desc').textContent=T('r.empty');}
  var cap=$('at-cap');clear(cap);
  var usesWlb=state.A.wlb.length<4||state.B.wlb.length<4;
  cap.appendChild(document.createTextNode(T('cap')+(usesWlb?T('cap.wlb'):'')));h('a',{href:README},cap,T('nav.method'));
  renderCells(a,b);
}

/* 40-cell table marks which group each cell belongs to */
function renderCells(a,b){
  var ct=$('at-ct');clear(ct);
  G.forEach(function(g){var inA=a.cells.indexOf(g)>=0,inB=b.cells.indexOf(g)>=0;
    var tr=h('tr',{class:inA||inB?'on':''},ct);h('td',null,tr,dn(g.department));h('td',null,tr,T('ot.'+g.overtime+'T'));h('td',null,tr,String(g.work_life_balance));h('td',null,tr,String(g.n));h('td',null,tr,String(g.left));h('td',null,tr,pct(g.left/g.n));
    h('td',null,tr,[inA?'A':'',inB?'B':''].filter(Boolean).join(' + '));});
}

/* ---------- department chart ---------- */
var svgD=$('at-dep');
function drawDept(){
  var W=Math.max(260,$('at-dep-host').clientWidth),narrow=W<420;
  var m={l:narrow?84:100,r:narrow?52:60,t:22,b:30},rowH=narrow?40:44,H=m.t+DEPTS.length*rowH+m.b;
  svgD.setAttribute('viewBox','0 0 '+W+' '+H);svgD.setAttribute('width',W);svgD.setAttribute('height',H);keepClear(svgD);
  var ov=sumL/sumN;
  var top=axisTop(D.departments.map(function(d){return d.ci95[1];}).concat([ov])),stp=tickStep(top);
  var x=function(v){return m.l+v/top*(W-m.l-m.r);};
  for(var t=0;t<=top+1e-9;t+=stp){var tt=Math.round(t*100)/100;s('line',{x1:x(tt),x2:x(tt),y1:m.t-4,y2:H-m.b,stroke:'#EEF1F4'},svgD);s('text',{x:x(tt),y:H-m.b+16,'text-anchor':'middle','font-size':12,fill:'#5B6B7B'},svgD,Math.round(tt*100)+'%');}
  D.departments.forEach(function(d,i){
    var cy=m.t+i*rowH+rowH/2;
    s('text',{x:m.l-10,y:cy,'text-anchor':'end','font-size':14,fill:'#1F2933'},svgD,dn(d.department));
    s('text',{x:m.l-10,y:cy+14,'text-anchor':'end','font-size':12,fill:'#5B6B7B'},svgD,d.left+'/'+d.n);
    s('rect',{x:x(0),y:cy-9,width:Math.max(1,x(d.rate)-x(0)),height:18,rx:2,fill:'#93B4F5'},svgD);
    s('line',{x1:x(d.ci95[0]),x2:x(d.ci95[1]),y1:cy,y2:cy,stroke:'#1F2933','stroke-width':1.5},svgD);
    [d.ci95[0],d.ci95[1]].forEach(function(v){s('line',{x1:x(v),x2:x(v),y1:cy-5,y2:cy+5,stroke:'#1F2933','stroke-width':1.5},svgD);});
    s('text',{x:x(Math.max(d.rate,d.ci95[1]))+6,y:cy+5,'font-size':13,fill:'#1F2933'},svgD,pct(d.rate));
  });
  s('line',{x1:x(ov),x2:x(ov),y1:m.t-6,y2:H-m.b,stroke:'#5B6B7B','stroke-dasharray':'4 3'},svgD);
  s('text',{x:x(ov),y:m.t-9,'text-anchor':'middle','font-size':12,fill:'#5B6B7B'},svgD,T('overall',pct(ov)));
  $('at-dep-cap').textContent=T('dep.cap');
  $('at-dep-desc').textContent=T('dep.desc',D.departments.map(function(d){return [dn(d.department),pct(d.rate),pct(d.ci95[0]),pct(d.ci95[1]),d.left,d.n];}));
}
function renderDeptTable(){
  var tb=$('at-dt');clear(tb);
  D.departments.forEach(function(d){var tr=h('tr',null,tb);h('td',null,tr,dn(d.department));h('td',null,tr,String(d.n));h('td',null,tr,String(d.left));h('td',null,tr,pct(d.rate));h('td',null,tr,pct(d.ci95[0])+' – '+pct(d.ci95[1]));});
}

/* language switch: rebuild translated pieces, keep the current comparison */
function renderLang(){applyStatic();renderKpis();buildQs();buildBuilder();renderDeptTable();render();drawDept();}
each('[data-lang]',function(btn){btn.addEventListener('click',function(){
  lang=btn.getAttribute('data-lang');
  try{window.localStorage.setItem(LS_KEY,lang);}catch(e){}
  renderLang();
});});

applyQ('ot');renderLang();
var rt=null;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){render();drawDept();},140);});
})();
</script>
